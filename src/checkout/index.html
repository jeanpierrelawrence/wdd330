<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="shortcut icon" href="../public/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/checkout.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place Your Order</h2>

        <div class="checkout-grid">
          <form id="checkout-form" name="checkout">
            <div class="form-section">
              <h3>Shipping Address</h3>
              
              <div class="form-row form-row--2">
                <div class="form-group">
                  <label for="fname">First Name</label>
                  <input type="text" id="fname" name="fname" required autocomplete="off"/>
                </div>
                <div class="form-group">
                  <label for="lname">Last Name</label>
                  <input type="text" id="lname" name="lname" required autocomplete="off"/>
                </div>
              </div>

              <div class="form-group">
                <label for="street">Street Address</label>
                <input type="text" id="street" name="street" required/>
              </div>

              <div class="form-row form-row--3">
                <div class="form-group">
                  <label for="city">City</label>
                  <input type="text" id="city" name="city" required/>
                </div>
                <div class="form-group">
                  <label for="state">State</label>
                  <input type="text" id="state" name="state" required/>
                </div>
                <div class="form-group">
                  <label for="zip">Zip Code</label>
                  <input type="text" id="zip" name="zip" required/>
                </div>
              </div>
            </div>

            <div class="form-section">
              <h3>Payment</h3>

              <div class="form-group">
                <label for="cardNumber">Card Number</label>
                <input type="text" id="cardNumber" name="cardNumber" required placeholder="1234123412341234" pattern="[0-9]{16}"/>
              </div>

              <div class="form-row form-row--2">
                <div class="form-group">
                  <label for="expiration">Expiration (MM/YY)</label>
                  <input type="text" id="expiration" name="expiration" required placeholder="08/28"/>
                </div>
                <div class="form-group">
                  <label for="code">Security Code (CVC)</label>
                  <input type="text" id="code" name="code" required placeholder="123" pattern="[0-9]{3,4}"/>
                </div>
              </div>
            </div>
          </form>

          <div class="order-summary">
            <h3>Order Summary</h3>
            <div class="summary-row">
              <span>Items (<span id="num-items">0</span>):</span>
              <span id="subtotal">$0.00</span>
            </div>
            <div class="summary-row">
              <span>Shipping Estimate:</span>
              <span id="shipping">$0.00</span>
            </div>
            <div class="summary-row">
              <span>Tax (6%):</span>
              <span id="tax">$0.00</span>
            </div>
            <hr />
            <div class="summary-row summary-total">
              <span>Order Total:</span>
              <span id="orderTotal">$0.00</span>
            </div>
            <button type="submit" form="checkout-form" id="checkoutSubmit" class="btn btn-checkout">Place Order</button>
          </div>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
