<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Marmot Ajax 3 person tent</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">

    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
  <header>
    <a href="../index.html" class="logo">
      <img src="../images/logos/logo.svg" alt="draussen logo" />
    </a>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="#">Shop</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
    <a href="cart/index.html" class="cart">
      <img src="../images/cart.svg" alt="Shopping Cart" class="cart-icon" />
    </a>
  </header>

  <main>
    <section class="product-detail">
      <div class="product-detail__media">
        <div class="product-detail__image-outline">
          <div class="product-detail__image-bg">
            <img
              id="productImage"
              src="../images/tents/rimrock.avif"
              alt="Cedar Ridge Rimrock Tent"
              class="product-detail__image"
            />
          </div>
        </div>
      </div>

      <div class="product-detail__info">
        <div class="product-detail__meta">
          <span class="card__brand" id="productBrand">Marmot</span>
          <span class="product__color-badge" id="productColor">Pale Pumpkin / Terracota</span>
        </div>

        <h1 class="product__title" id="productName">Ajax Tent</h1>
        <p class="product__price" id="productPrice">$199.99</p>

        <p class="product__description" id="productDescription">
          Get out and enjoy nature with Marmot's Ajax tent, featuring a smart design with durable, waterproof construction and two doors for easy access.
        </p>

        <div class="product-detail__action">
          <button id="addToCart" data-id="344YJ">Add to Cart</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy;2026 | SleepOutside | WDD 330 | BYU-Idaho for BYU-Pathway Worldwide Online</p>
  </footer>
</body>
</html>
