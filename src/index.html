<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="./css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main>
      <section class="hero">
        <div class="hero__image-wrapper">
          <img
            src="./images/hero-bg.avif"
            alt="Camper van in mountain landscape"
          />
        </div>
      </section>

      <section class="mission">
        <h1>
          Our mission is to provide you with everything you need to sleep
          outside comfortably at an affordable price.
        </h1>
      </section>

      <section class="categories">
        <h2>Shop by Category</h2>
        <div class="category-grid">
          <a href="/product_listing/index.html?category=tents">
            <img src="./public/images/tents.svg" alt="Tents" />
            <h3>Tents</h3>
          </a>
          <a href="/product_listing/index.html?category=backpacks">
            <img src="./public/images/backpacks.svg" alt="Backpacks" />
            <h3>Backpacks</h3>
          </a>
          <a href="/product_listing/index.html?category=sleeping-bags">
            <img src="./public/images/sleeping-bags.svg" alt="Sleeping Bags" />
            <h3>Sleeping Bags</h3>
          </a>
          <a href="/product_listing/index.html?category=hammocks">
            <img src="./public/images/hammocks.svg" alt="Hammocks" />
            <h3>Hammocks</h3>
          </a>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
